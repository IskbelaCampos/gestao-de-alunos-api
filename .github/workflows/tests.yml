name: Testes de API

on:
  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Europe/Lisbon'

  push:
    branches: [main]

  pull_request:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar API
        run: |
          npm start > /tmp/gestao-de-alunos-api.log 2>&1 &
          api_pid=$!

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "API pronta para os testes."
              exit 0
            fi

            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/gestao-de-alunos-api.log
              echo "A API encerrou antes de ficar pronta."
              exit 1
            fi

            sleep 2
          done

          cat /tmp/gestao-de-alunos-api.log
          echo "A API não ficou pronta dentro do tempo limite."
          exit 1

      - name: Executar testes
        run: npm test